# ============================================================
#  CORE SETTINGS (used by pressure-swap.sh)
# ============================================================

SWAP_DIR="/pagefiles"
# SWAP_DIR_FALLBACK="/tmp"          # default fallback if SWAP_DIR can't be created
                                     # leave empty to disable fallback (script will exit)

PREFIX="emergency_chunk"            # chunk files named e.g. emergency_chunk_0
CHUNK_SIZE_MB=512                   # size of a single chunk

# Minimum / maximum total emergency swap size.
# Plain number (MiB) or expression using `total_swap` (primary swap MiB) and `ram` (MiB).
# Examples:
#   MAX_SWAP_MB="ram / 2"
#   MIN_SWAP_MB="total_swap / 4"
MIN_SWAP_MB=0
MAX_SWAP_MB=0                       # 0 = unlimited (uses MAX_CHUNKS instead)
MAX_CHUNKS=0                        # max number of chunks (only if MAX_SWAP_MB=0)

MIN_FREE_SPACE_MB=1042              # must keep > this much MiB free after adding a chunk

ADD_THRESHOLD_PCT=90                # start adding when primary pressure >= this %
REMOVE_THRESHOLD_PCT=70             # start removal countdown when <= this %

SWAP_PRIORITY=-50                   # emergency swap priority (zram ~100, raw ~30)
                                    # negative ensures it's always last resort

ADD_STABILITY_SECS=0                # seconds of sustained high pressure before adding
                                    # WARNING: values >0 increase OOM risk

REMOVE_STABILITY_SECS=30            # seconds of sustained low pressure before removal

# PSI (Pressure Stall Information) thresholds for removal.
# The kernel reports how much time tasks are stalled waiting for memory or I/O.
# Higher values mean the system is thrashing; removal is blocked if exceeded.
MEM_PSI_SOME_THRESHOLD=2.0          # memory some avg60 (%)
IO_PSI_SOME_THRESHOLD=5.0           # I/O some avg60 (%)

# Logging & state
LOGFILE="/var/log/pressure-swap.log"
LOG_MAX_SIZE=10485760               # 10 MiB, rotates keeping last 1 MiB
HEARTBEAT_INTERVAL_SECS=30
LOCKFILE="/run/pressure-swap.lock"
STATE_COUNTER_FILE="/run/pressure-swap-remove-counter"
VERBOSE=false                       # enable detailed logs (also via -v)

# Standalone daemon mode (--loop) sleep interval
LOOP_INTERVAL_SECS=1

# Optional: restrict primary swap monitoring to these devices (space‑separated).
# Leave empty to auto‑detect all non‑emergency swap devices.
SWAP_DEVICES=""

# ============================================================
#  COSMETIC / DASHBOARD SETTINGS (used by pressure-swap-dashboard)
# ============================================================

SHOW_PSI=true                       # show PSI section in dashboard
REFRESH_SECONDS=1                   # dashboard refresh rate
COLOR_OUTPUT=true                   # ANSI colours; set to false or export NO_COLOR to disable